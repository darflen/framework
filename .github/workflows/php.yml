name: Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-26.04
    services:
      redis:
        image: redis
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mariadb:
        image: mariadb:11.4 # Choose your preferred version
        env:
          MARIADB_ROOT_PASSWORD: ''
          MARIADB_DATABASE: test_db
          MARIADB_USER: test_user
          MARIADB_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
            --health-cmd="mariadb-admin ping"
            --health-interval=10s
            --health-timeout=5s
            --health-retries=3
    steps:
      - uses: actions/checkout@v4

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Start httpbin
        run: |
          docker run -d \
            --name httpbin \
            -p 8000:80 \
            kennethreitz/httpbin

      - name: Wait for httpbin
        run: |
          for i in {1..30}; do
            if curl -fs http://127.0.0.1:8000/get > /dev/null; then
              echo "httpbin is ready"
              exit 0
            fi
            sleep 1
          done
          echo "httpbin failed to start"
          docker logs httpbin
          exit 1

      - name: Start mailpit
        run: |
          docker run -d \
            --name mailpit \
            -p 8025:8025 \
            -p 1025:1025 \
            axllent/mailpit

      - name: Wait for mailpit
        run: |
          for i in {1..30}; do
            if curl -fs http://127.0.0.1:8025/api/v1/info > /dev/null; then
              echo "mailpit is ready"
              exit 0
            fi
            sleep 1
          done
          echo "mailpit failed to start"
          docker logs mailpit
          exit 1

      - name: Setup ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Wait for ffmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Run test suite
        run: composer run-script test
